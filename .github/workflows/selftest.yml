name: selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Python. actions/python-versions has no 3.9 build for Ubuntu 26.04 (ubuntu-latest).
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.12"
            os: ubuntu-latest
          # The runner's own python3: the interpreter seo-cron.yml uses.
          - python: system
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: matrix.python != 'system'
        with:
          python-version: ${{ matrix.python }}
      - name: interpreter
        run: python3 --version
      - name: seo_check.py self-test (planted defects)
        run: python3 -W error scripts/seo_check.py --selftest
      - name: seo_crawl.py self-test (planted defects and a clean control site)
        run: python3 -W error scripts/seo_crawl.py --selftest
      - name: index coverage (mock Webmaster and Search Console APIs)
        run: python3 -W error tests/test_index.py scripts/seo_index.py
      - name: Wordstat (mock API)
        run: python3 -W error tests/test_wordstat.py scripts/wordstat.py
      - name: SERP clusters
        run: python3 -W error tests/test_cluster.py scripts/serp_cluster.py
      - name: robots.txt matching
        run: python3 -W error tests/test_robots.py scripts/seo_check.py
      - name: calendar
        run: python3 -W error tests/test_calendar.py scripts/seo_calendar.py
      - name: query gaps
        run: python3 -W error tests/test_gaps.py scripts/gsc_gaps.py
      - name: IndexNow
        run: python3 -W error tests/test_indexnow.py scripts/indexnow.py
      - name: keys file
        run: python3 -W error tests/test_keys.py scripts/seo_keys.py
      - name: calendar template
        run: python3 scripts/seo_calendar.py validate --calendar templates/calendar.json --template
      - name: plugin manifests are valid JSON
        run: python3 -c "import json; [json.load(open(p, encoding='utf-8')) for p in ('.claude-plugin/plugin.json', '.claude-plugin/marketplace.json')]; print('ok')"
