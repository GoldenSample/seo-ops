name: selftest

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: seo_check.py self-test (one planted defect per check)
        run: python -W error scripts/seo_check.py --selftest
      - name: robots.txt matching
        run: python -W error tests/test_robots.py scripts/seo_check.py
      - name: calendar
        run: python -W error tests/test_calendar.py scripts/seo_calendar.py
      - name: query gaps
        run: python -W error tests/test_gaps.py scripts/gsc_gaps.py
      - name: IndexNow
        run: python -W error tests/test_indexnow.py scripts/indexnow.py
      - name: calendar template
        run: python scripts/seo_calendar.py validate --calendar templates/calendar.json --template
      - name: plugin manifests are valid JSON
        run: python -c "import json; [json.load(open(p, encoding='utf-8')) for p in ('.claude-plugin/plugin.json', '.claude-plugin/marketplace.json')]; print('ok')"
